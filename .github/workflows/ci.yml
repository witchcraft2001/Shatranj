name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.10.3
  QT_QPA_PLATFORM: offscreen

jobs:
  spectrum-and-host:
    name: Spectrum and host contracts
    runs-on: ubuntu-24.04
    container: z88dk/z88dk:2.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: apk add --no-cache python3
      - name: Run full contract suite
        run: make full-check

  sprinter-check:
    name: Sprinter target
    runs-on: ubuntu-24.04
    container: z88dk/z88dk:2.4
    timeout-minutes: 15
    steps:
      - name: Install git for submodule checkout
        run: apk add --no-cache git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Python, mtools and bash
        # bash: the z88dk container is Alpine and ships none, but
        # tools/run_sprinter_z80_tests.sh needs it.
        run: apk add --no-cache python3 mtools bash
      - name: Cache sjasmplus
        id: cache-sjasmplus
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/sjasmplus
          key: sjasmplus-v1.22.0-9ee89d1c1b2bad0d50f499a59a41586a04937bf4
      - name: Build sjasmplus v1.22.0
        if: steps.cache-sjasmplus.outputs.cache-hit != 'true'
        run: |
          apk add --no-cache build-base
          git clone --recursive --branch v1.22.0 --depth 1 \
            https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus-src
          # A tag is a mutable pin: fail loudly if it no longer points at
          # the commit this workflow was written against.
          test "$(git -C /tmp/sjasmplus-src rev-parse HEAD)" = \
            "9ee89d1c1b2bad0d50f499a59a41586a04937bf4"
          make -C /tmp/sjasmplus-src -j"$(nproc)"
          install -m 755 /tmp/sjasmplus-src/sjasmplus /usr/local/bin/sjasmplus
      - name: Verify sjasmplus
        run: sjasmplus --version
      - name: Run Sprinter target checks
        run: make sprinter-check

  desktop-unix:
    name: Qt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build and test desktop client
        run: make client-test

  desktop-windows:
    name: Qt (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          dir: C:/
          cache: true
      - name: Build and test desktop client
        shell: cmd
        run: client\build-pc.cmd
